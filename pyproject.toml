[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "montaje"
version = "0.1.0"
description = "Edición de vídeos largos a cámara (opinión, vlogs) en CapCut con ayuda de Claude"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
mac = ["mlx-whisper>=0.4; platform_system == 'Darwin' and platform_machine == 'arm64'",
       "faster-whisper>=1.1; platform_system != 'Darwin' or platform_machine != 'arm64'"]
whisper = ["faster-whisper>=1.1"]
dev = ["pytest>=8"]

[project.scripts]
montaje = "montaje.cli:main"

[tool.setuptools.packages.find]
include = ["montaje*"]

[tool.setuptools.package-data]
montaje = ["estilos/*.json", "capcut/defaults.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
